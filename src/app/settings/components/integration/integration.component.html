<div class="page-wrapper">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h2>Integration Settings</h2>
      <p>Configure Email and WhatsApp notification settings for your store.</p>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="loading-box">
    <nz-spin nzSize="large" nzTip="Loading..."></nz-spin>
  </div>

  <!-- Form -->
  <form *ngIf="!loading" [formGroup]="form" nz-form nzLayout="vertical">
    <div class="settings-grid">

      <!-- EMAIL CARD -->
      <nz-card>
        <div class="card-title-row">
          <div class="card-title">
            <span nz-icon nzType="mail" nzTheme="outline" class="card-icon email-icon"></span>
            <span class="card-label">Email Settings</span>
          </div>
          <nz-form-item style="margin: 0">
            <nz-form-control>
              <nz-switch formControlName="isEmailEnabled"></nz-switch>
            </nz-form-control>
          </nz-form-item>
        </div>

        <nz-divider></nz-divider>

        <div [class.disabled-section]="!isEmailEnabled">

          <nz-form-item>
            <nz-form-label>Email Provider</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="emailProvider" nzPlaceHolder="Select Provider">
                <nz-option nzValue="SendGrid" nzLabel="SendGrid"></nz-option>
                <nz-option nzValue="SMTP"     nzLabel="SMTP"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>API Key</nz-form-label>
            <nz-form-control>
              <nz-input-group [nzSuffix]="emailKeyTpl">
                <input nz-input formControlName="emailApiKey"
                  [type]="showEmailKey ? 'text' : 'password'"
                  placeholder="Enter API Key" />
              </nz-input-group>
              <ng-template #emailKeyTpl>
                <span nz-icon [nzType]="showEmailKey ? 'eye' : 'eye-invisible'"
                  (click)="showEmailKey = !showEmailKey" style="cursor:pointer"></span>
              </ng-template>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Sender Email</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="emailSenderAddress"
                placeholder="from@yourstore.com" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Sender Name</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="emailSenderName"
                placeholder="Your Store Name" />
            </nz-form-control>
          </nz-form-item>

        </div>
      </nz-card>

      <!-- WHATSAPP CARD -->
      <nz-card>
        <div class="card-title-row">
          <div class="card-title">
            <span nz-icon nzType="message" nzTheme="outline" class="card-icon wa-icon"></span>
            <span class="card-label">WhatsApp Settings</span>
          </div>
          <nz-form-item style="margin: 0">
            <nz-form-control>
              <nz-switch formControlName="isWhatsAppEnabled"></nz-switch>
            </nz-form-control>
          </nz-form-item>
        </div>

        <nz-divider></nz-divider>

        <div [class.disabled-section]="!isWhatsAppEnabled">

          <nz-form-item>
            <nz-form-label>WhatsApp Provider</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="whatsAppProvider" nzPlaceHolder="Select Provider">
                <nz-option nzValue="Meta"   nzLabel="Meta (Official)"></nz-option>
                <nz-option nzValue="Twilio" nzLabel="Twilio"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Access Token</nz-form-label>
            <nz-form-control>
              <nz-input-group [nzSuffix]="waTokenTpl">
                <input nz-input formControlName="whatsAppToken"
                  [type]="showWaToken ? 'text' : 'password'"
                  placeholder="Enter Access Token" />
              </nz-input-group>
              <ng-template #waTokenTpl>
                <span nz-icon [nzType]="showWaToken ? 'eye' : 'eye-invisible'"
                  (click)="showWaToken = !showWaToken" style="cursor:pointer"></span>
              </ng-template>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Phone Number ID</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="whatsAppPhoneNumberId"
                placeholder="Meta Phone Number ID" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label>Business ID</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="whatsAppBusinessId"
                placeholder="Meta Business ID" />
            </nz-form-control>
          </nz-form-item>

        </div>
      </nz-card>

    </div>

    <!-- Save Button -->
    <div class="save-row">
      <button nz-button nzType="primary" nzSize="large"
        [nzLoading]="saveLoading" (click)="save()">
        <span nz-icon nzType="save"></span>
        Save Settings
      </button>
    </div>

  </form>

</div>
