<div class="card-body">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h4 mb-1">Add Order</h2>
      <p class="text-muted mb-0">Create a new order with customer and total amount details.</p>
    </div>
    <a class="btn btn-secondary" routerLink="/order/dashboard">Back to Dashboard</a>
  </div>

  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="tenantId" class="form-label">Tenant ID</label>
        <input id="tenantId" type="number" class="form-control" formControlName="tenantId" required>
      </div>
      <div class="col-md-6">
        <label for="customerName" class="form-label">Customer Name</label>
        <input id="customerName" type="text" class="form-control" formControlName="customerName" required>
      </div>
      <div class="col-md-6">
        <label for="customerEmail" class="form-label">Customer Email</label>
        <input id="customerEmail" type="email" class="form-control" formControlName="customerEmail">
      </div>
      <div class="col-md-6">
        <label for="customerPhone" class="form-label">Customer Phone</label>
        <input id="customerPhone" type="text" class="form-control" formControlName="customerPhone">
      </div>
      <div class="col-md-6">
        <label for="totalAmount" class="form-label">Total Amount</label>
        <input id="totalAmount" type="number" step="0.01" class="form-control" formControlName="totalAmount" required>
      </div>
      <div class="col-md-6">
        <label for="status" class="form-label">Status</label>
        <select id="status" class="form-select" formControlName="status">
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
    </div>
    <div class="mt-4 text-end">
      <button class="btn btn-primary" type="submit" [disabled]="!orderForm.valid">Create Order</button>
    </div>
  </form>
</div>
