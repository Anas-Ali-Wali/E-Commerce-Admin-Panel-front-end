<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">Order Dashboard</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">Track orders by tenant and manage order lifecycle.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="primary" routerLink="/order/add">
        <span nz-icon nzType="plus"></span>
        Add Order
      </button>
    </div>
  </div>

  <nz-input-group nzPrefixIcon="search" style="width: 300px; margin-bottom: 16px;">
  <input
    nz-input
    placeholder="Search order..."
    [(ngModel)]="searchText"
    (ngModelChange)="onSearch()" />
</nz-input-group>

  <nz-table
    #orderTable
    [nzData]="orders"
    [nzLoading]="isLoading"
    [nzTotal]="totalCount"
    [nzPageIndex]="currentPage"
    [nzPageSize]="pageSize"
    [nzFrontPagination]="true"
    (nzPageIndexChange)="onPageChange($event)"
    nzBordered
    nzSize="middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Customer Name</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th nzAlign="right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.orderId }}</td>
        <td>{{ order.customerName }}</td>
        <td>{{ order.totalAmount | currency }}</td>
        <!-- <td>
          <nz-tag [nzColor]="getStatusColor(order.status)">
            {{ order.status }}
          </nz-tag>
        </td> -->
                <td>
          <nz-select
            [ngModel]="order.status"
            (ngModelChange)="updateStatus(order, $event)"
            nzSize="small"
            style="width: 130px;">
            <nz-option nzValue="Pending" nzLabel="Pending"></nz-option>
            <nz-option nzValue="Confirmed" nzLabel="Confirmed"></nz-option>
            <nz-option nzValue="Cancelled" nzLabel="Cancelled"></nz-option>
          </nz-select>
        </td>

        <td nzAlign="right">
          <button nz-button nzType="default" nzDanger nzSize="small"
            nz-popconfirm nzPopconfirmTitle="Are you sure you want to delete this order?"
            (nzOnConfirm)="deleteOrder(order.orderId)">
            <span nz-icon nzType="delete"></span>
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>
