<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="h4 mb-1">Order Dashboard</h2>
    <p class="text-muted mb-0">Track orders by tenant and manage order lifecycle.</p>
  </div>
  <a class="btn btn-primary" routerLink="/order/add">Add Order</a>
</div>
<div class="row gy-3 align-items-end mb-4">
  <div class="col-md-4">
    <label for="tenantId" class="form-label">Tenant ID</label>
    <input id="tenantId" type="number" class="form-control" [(ngModel)]="tenantId" (change)="onTenantChange()">
  </div>
  <div class="col-auto pt-4">
    <button class="btn btn-outline-secondary" (click)="loadOrders()">Load Orders</button>
  </div>
</div>
<div class="table-responsive shadow-sm rounded">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Customer Name</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.orderId }}</td>
        <td>{{ order.customerName }}</td>
        <td>{{ order.totalAmount | currency }}</td>
        <td>{{ order.status }}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" (click)="deleteOrder(order.orderId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<nav class="mt-4" aria-label="Order pagination">
  <ul class="pagination justify-content-end mb-0">
    <li class="page-item" [class.disabled]="currentPage <= 1">
      <button class="page-link" (click)="onPageChange(currentPage - 1)">Previous</button>
    </li>
    <li class="page-item disabled"><span class="page-link">Page {{ currentPage }}</span></li>
    <li class="page-item" [class.disabled]="currentPage * pageSize >= totalCount">
      <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
    </li>
  </ul>
</nav>
