<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">User Dashboard</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">Browse users for the selected tenant.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="primary" routerLink="/user/add">
        <span nz-icon nzType="plus"></span>
        Add User
      </button>
    </div>
  </div>

  <nz-input-group nzPrefixIcon="search" style="width: 300px; margin-bottom: 16px;">
  <input
    nz-input
    placeholder="Search user..."
    [(ngModel)]="searchText"
    (ngModelChange)="onSearch()" />
</nz-input-group>

  <nz-table
  #userTable
  [nzData]="users"
  [nzLoading]="isLoading"
  [nzTotal]="totalCount"
  [nzPageIndex]="currentPage"
  [nzPageSize]="pageSize"
  [nzFrontPagination]="true"
  (nzPageIndexChange)="onPageChange($event)"
  nzBordered
  nzSize="middle">


    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th nzAlign="right">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.userId }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>
          <nz-tag [nzColor]="user.role === 'Admin' ? 'purple' : 'blue'">
            {{ user.role }}
          </nz-tag>
        </td>
        <td>
          <nz-tag [nzColor]="user.status ? 'success' : 'error'">
            {{ user.status ? 'Active' : 'Inactive' }}
          </nz-tag>
        </td>
        <td nzAlign="right">
          <button
            nz-button
            nzType="default"
            nzDanger
            nzSize="small"
            nz-popconfirm
            nzPopconfirmTitle="Are you sure you want to delete this user?"
            (nzOnConfirm)="deleteUser(user.userId)">
            <span nz-icon nzType="delete"></span>
            Delete
          </button>
        </td>
      </tr>
    </tbody>

  </nz-table>
</nz-card>
