<nz-card>

  <div nz-row nzJustify="space-between">
    <h2>Customer Dashboard</h2>

    <button nz-button nzType="primary" routerLink="/customer/add">
      Add Customer
    </button>
  </div>

  <nz-table [nzData]="customers" [nzLoading]="isLoading">

    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.customerId }}</td>
        <td>{{ c.firstName }} {{ c.lastName }}</td>
        <td>{{ c.email }}</td>

        <td>
          <nz-tag [nzColor]="c.status ? 'green' : 'red'">
            {{ c.status ? 'Active' : 'Inactive' }}
          </nz-tag>
        </td>

        <td>
          <!-- <button nz-button nzDanger (click)="deleteCustomer(c.customerId)">
           <i class="bi bi-trash-fill"></i> Delete
          </button> -->
         <button
            nz-button
            nzType="default"
            nzDanger
            nzSize="small"
            nz-popconfirm
            nzPopconfirmTitle="Are you sure you want to delete this user?"
            (nzOnConfirm)="deleteCustomer(c.customerId)">
            <span nz-icon nzType="delete"></span>
            Delete
          </button>
        </td>
        

      </tr>
    </tbody>

  </nz-table>

</nz-card>
