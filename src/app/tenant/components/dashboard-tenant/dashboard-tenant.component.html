<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="h4 mb-1">Tenant Dashboard</h2>
    <p class="text-muted mb-0">Review tenant details and manage active tenants.</p>
  </div>
  <a class="btn btn-primary" routerLink="/tenant/add">Add Tenant</a>
</div>
<div class="table-responsive shadow-sm rounded">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Domain</th>
        <th>Status</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tenant of tenants">
        <td>{{ tenant.tenantId }}</td>
        <td>{{ tenant.name }}</td>
        <td>{{ tenant.domain }}</td>
        <td>{{ tenant.status ? 'Active' : 'Inactive' }}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" (click)="deleteTenant(tenant.tenantId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<nav class="mt-4" aria-label="Tenant pagination">
  <ul class="pagination justify-content-end mb-0">
    <li class="page-item" [class.disabled]="currentPage <= 1">
      <button class="page-link" (click)="onPageChange(currentPage - 1)">Previous</button>
    </li>
    <li class="page-item disabled"><span class="page-link">Page {{ currentPage }}</span></li>
    <li class="page-item" [class.disabled]="currentPage * pageSize >= totalCount">
      <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
    </li>
  </ul>
</nav>
