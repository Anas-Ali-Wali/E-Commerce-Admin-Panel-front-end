<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">Tenant Dashboard</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">Review tenant details and manage active tenants.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="primary" routerLink="/tenant/add">
        <span nz-icon nzType="plus"></span>
        Add Tenant
      </button>
    </div>
  </div>

  <nz-table
    #tenantTable
    [nzData]="tenants"
    [nzLoading]="isLoading"
    [nzTotal]="totalCount"
    [nzPageIndex]="currentPage"
    [nzPageSize]="pageSize"
    [nzFrontPagination]="false"
    (nzPageIndexChange)="onPageChange($event)"
    nzBordered
    nzSize="middle">

    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Domain</th>
        <th>Status</th>
        <th nzAlign="right">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let tenant of tenants">
        <td>{{ tenant.tenantId }}</td>
        <td>{{ tenant.name }}</td>
        <td>{{ tenant.domain }}</td>
        <td>
          <nz-tag [nzColor]="tenant.status ? 'success' : 'error'">
            {{ tenant.status ? 'Active' : 'Inactive' }}
          </nz-tag>
        </td>
        <td nzAlign="right">
          <button
            nz-button
            nzType="default"
            nzDanger
            nzSize="small"
            nz-popconfirm
            nzPopconfirmTitle="Are you sure you want to delete this tenant?"
            (nzOnConfirm)="deleteTenant(tenant.tenantId)">
            <span nz-icon nzType="delete"></span>
            Delete
          </button>
        </td>
      </tr>
    </tbody>

  </nz-table>
</nz-card>
