<div class="add-page-wrap">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h2 class="page-title">Add Page</h2>
      <p class="page-subtitle">Create a public page for site content.</p>
    </div>
    <div class="header-actions">
      <button class="btn-back" routerLink="/page/dashboard">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
      </button>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="form-card">

    <form [formGroup]="pageForm" (ngSubmit)="onSubmit()">

      <div class="form-grid">

        <!-- TITLE -->
        <div class="form-group">
          <label class="form-label">Title <span class="req">*</span></label>
          <input
            type="text"
            class="form-input"
            [class.is-invalid]="pageForm.get('title')?.invalid && pageForm.get('title')?.dirty"
            formControlName="title"
            placeholder="Enter page title" />
          <span class="error-msg" *ngIf="pageForm.get('title')?.invalid && pageForm.get('title')?.dirty">
            Title is required
          </span>
        </div>

        <!-- SLUG -->
        <div class="form-group">
          <label class="form-label">Slug <span class="req">*</span></label>
          <div class="input-prefix-wrap">
            <span class="input-prefix">/</span>
            <input
              type="text"
              class="form-input with-prefix"
              [class.is-invalid]="pageForm.get('slug')?.invalid && pageForm.get('slug')?.dirty"
              formControlName="slug"
              placeholder="e.g. about-us"
              (input)="onSlugInput($event)" />
          </div>
          <span class="error-msg" *ngIf="pageForm.get('slug')?.invalid && pageForm.get('slug')?.dirty">
            Slug is required
          </span>
        </div>

      </div>

      <!-- STATUS BOX -->
      <div class="status-box">
        <div class="status-box-left">
          <i class="bi bi-eye status-icon"></i>
          <div>
            <span class="status-title">Visibility</span>
            <p class="status-desc">Check to make this page publicly visible on the site.</p>
          </div>
        </div>
        <label class="custom-checkbox">
          <input type="checkbox" formControlName="status" />
          <span class="checkmark"></span>
          Published / Active
        </label>
      </div>

      <!-- ACTIONS -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/page/dashboard">
          Cancel
        </button>
        <button
          type="submit"
          class="btn-submit"
          [disabled]="!pageForm.valid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
          <i class="bi bi-plus-lg" *ngIf="!isSubmitting"></i>
          {{ isSubmitting ? 'Creating...' : 'Create Page' }}
        </button>
      </div>

    </form>

  </div>

</div>
