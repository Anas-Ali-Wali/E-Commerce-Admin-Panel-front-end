<nz-card class="page-dashboard-card">

  <!-- =========================
       HEADER
  ========================== -->
  <div
    nz-row
    nzJustify="space-between"
    nzAlign="middle"
    class="dashboard-header">

    <div nz-col class="header-left">

      <h2 nz-typography class="dashboard-title">
        Page Dashboard
      </h2>

      <p nz-typography nzType="secondary" class="dashboard-subtitle">
        Review pages and publish content for tenants.
      </p>

    </div>

    <div nz-col>

      <button
        nz-button
        nzType="primary"
        routerLink="/page/add"
        class="add-page-btn">

        <span nz-icon nzType="plus"></span>
        Add Page

      </button>

    </div>

  </div>

  <!-- =========================
       DESKTOP TABLE
  ========================== -->
  <div class="desktop-table">

    <nz-table
      #pageTable
      [nzData]="pages"
      [nzLoading]="isLoading"
      [nzTotal]="totalCount"
      [nzPageIndex]="currentPage"
      [nzPageSize]="pageSize"
      [nzFrontPagination]="false"
      (nzPageIndexChange)="onPageChange($event)"
      nzBordered
      nzSize="middle"
      [nzScroll]="{ x: '900px' }">

      <thead>

        <tr>

          <th>ID</th>

          <th>Title</th>

          <th>Slug</th>

          <th>Status</th>

          <th nzAlign="right">Actions</th>

        </tr>

      </thead>

      <tbody>

        <tr *ngFor="let page of pages">

          <td>{{ page.pageId }}</td>

          <td class="page-title-cell">
            {{ page.title }}
          </td>

          <td>

            <nz-tag nzColor="blue">

              <span nz-icon nzType="link"></span>

              /{{ page.slug }}

            </nz-tag>

          </td>

          <td>

            <nz-tag [nzColor]="page.status ? 'success' : 'error'">

              {{ page.status ? 'Published' : 'Draft' }}

            </nz-tag>

          </td>

          <td nzAlign="right">

            <div class="table-actions">

              <!-- SECTIONS -->
              <button
                nz-button
                nzType="default"
                nzSize="small"
                [routerLink]="['/section/dashboard']"
                [queryParams]="{ pageId: page.pageId }">

                <span nz-icon nzType="layout"></span>
                Sections

              </button>

              <!-- DELETE -->
              <button
                nz-button
                nzType="default"
                nzDanger
                nzSize="small"
                nz-popconfirm
                nzPopconfirmTitle="Are you sure you want to delete this page?"
                (nzOnConfirm)="deletePage(page.pageId)">

                <span nz-icon nzType="delete"></span>
                Delete

              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </nz-table>

  </div>

  <!-- =========================
       MOBILE CARDS
  ========================== -->
  <div class="mobile-page-cards">

    <div
      class="page-mobile-card"
      *ngFor="let page of pages">

      <!-- TOP -->
      <div class="mobile-card-top">

        <div>

          <h3>{{ page.title }}</h3>

          <p>ID: {{ page.pageId }}</p>

        </div>

        <nz-tag [nzColor]="page.status ? 'success' : 'error'">

          {{ page.status ? 'Published' : 'Draft' }}

        </nz-tag>

      </div>

      <!-- BODY -->
      <div class="mobile-card-body">

        <div class="info-item">

          <span class="label">
            Page Slug
          </span>

          <nz-tag nzColor="blue">

            <span nz-icon nzType="link"></span>

            /{{ page.slug }}

          </nz-tag>

        </div>

      </div>

      <!-- FOOTER -->
      <div class="mobile-card-footer">

        <button
          nz-button
          nzType="primary"
          nzBlock
          class="mobile-btn"
          [routerLink]="['/section/dashboard']"
          [queryParams]="{ pageId: page.pageId }">

          <span nz-icon nzType="layout"></span>
          Manage Sections

        </button>

        <button
          nz-button
          nzDanger
          nzBlock
          class="mobile-btn"
          nz-popconfirm
          nzPopconfirmTitle="Delete this page?"
          (nzOnConfirm)="deletePage(page.pageId)">

          <span nz-icon nzType="delete"></span>
          Delete Page

        </button>

      </div>

    </div>

  </div>

</nz-card>
