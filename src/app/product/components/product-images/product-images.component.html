<nz-card class="product-images-page">

  <!-- =========================
       PAGE HEADER
  ========================== -->
  <div
    nz-row
    nzJustify="space-between"
    nzAlign="middle"
    class="page-header">

    <div nz-col>

      <h2 nz-typography class="page-title">
        Product Images
      </h2>

      <p nz-typography nzType="secondary" class="page-subtitle">
        {{ product?.name }} — Add multiple color images
      </p>

    </div>

    <div nz-col>

      <button
        nz-button
        nzType="default"
        routerLink="/product/dashboard"
        class="back-btn">

        <span nz-icon nzType="arrow-left"></span>
        Back to Dashboard

      </button>

    </div>

  </div>

  <!-- =========================
       MAIN GRID
  ========================== -->
  <div
    nz-row
    [nzGutter]="24"
    class="main-grid">

    <!-- =========================
         LEFT SIDEBAR
    ========================== -->
    <div
      nz-col
      nzXs="24"
      nzSm="24"
      nzMd="24"
      nzLg="8">

      <nz-card
        nzTitle="Add New Image"
        class="upload-card">

        <!-- FILE -->
        <nz-form-item>

          <nz-form-label nzRequired>
            Select Image
          </nz-form-label>

          <nz-form-control>

            <label class="file-upload-box">

              <input
                type="file"
                (change)="onFileSelected($event)"
                accept="image/*"
                hidden />

              <span nz-icon nzType="upload"></span>

              <span>
                {{ selectedFile ? selectedFile.name : 'Click to upload image' }}
              </span>

            </label>

          </nz-form-control>

        </nz-form-item>

        <!-- PREVIEW -->
        <div
          *ngIf="previewUrl"
          class="preview-wrapper">

          <img
            [src]="previewUrl"
            class="preview-image" />

          <button
            nz-button
            nzType="link"
            nzDanger
            class="remove-btn"
            (click)="clearFile()">

            <span nz-icon nzType="close"></span>
            Remove

          </button>

        </div>

        <!-- COLOR -->
        <nz-form-item>

          <nz-form-label>
            Color Name
          </nz-form-label>

          <nz-form-control>

            <input
              nz-input
              [(ngModel)]="colorName"
              placeholder="e.g. Red, Black, Blue" />

          </nz-form-control>

        </nz-form-item>

        <!-- PRIMARY -->
        <nz-form-item>

          <nz-form-control>

            <label
              nz-checkbox
              [(ngModel)]="isPrimary">

              Set as Primary Image

              <span class="checkbox-note">
                (Shop page pe dikhegi)
              </span>

            </label>

          </nz-form-control>

        </nz-form-item>

        <!-- BUTTON -->
        <button
          nz-button
          nzType="primary"
          nzBlock
          class="upload-btn"
          [nzLoading]="isUploading"
          (click)="uploadImage()">

          <span nz-icon nzType="upload"></span>
          Upload Image

        </button>

      </nz-card>

    </div>

    <!-- =========================
         RIGHT SIDE IMAGES
    ========================== -->
    <div
      nz-col
      nzXs="24"
      nzSm="24"
      nzMd="24"
      nzLg="16">

      <nz-card
        [nzTitle]="'Product Images (' + images.length + ')'">

        <!-- LOADING -->
        <div
          *ngIf="isLoading"
          class="loading-wrapper">

          <nz-spin nzSimple></nz-spin>

        </div>

        <!-- EMPTY -->
        <nz-empty
          *ngIf="!isLoading && images.length === 0"
          nzNotFoundContent="No images added yet">

        </nz-empty>

        <!-- IMAGE GRID -->
        <div
          *ngIf="!isLoading && images.length > 0"
          class="images-grid">

          <!-- IMAGE CARD -->
          <div
            *ngFor="let img of images"
            class="image-card">

            <!-- PRIMARY TAG -->
            <nz-tag
              *ngIf="img.isPrimary"
              nzColor="gold"
              class="primary-tag">

              <span nz-icon nzType="star"></span>
              Primary

            </nz-tag>

            <!-- IMAGE -->
            <img
              [src]="baseUrl + img.imageUrl"
              class="product-image" />

            <!-- CONTENT -->
            <div class="image-card-content">

              <p class="color-name">
                {{ img.colorName || 'No color' }}
              </p>

              <!-- ACTIONS -->
              <div class="image-actions">

                <button
                  nz-button
                  nzSize="small"
                  nzType="default"
                  [disabled]="img.isPrimary"
                  nz-tooltip
                  nzTooltipTitle="Set as primary"
                  (click)="setPrimary(img.imageId)">

                  <span nz-icon nzType="star"></span>

                </button>

                <button
                  nz-button
                  nzSize="small"
                  nzType="default"
                  nzDanger
                  nz-popconfirm
                  nzPopconfirmTitle="Delete this image?"
                  (nzOnConfirm)="deleteImage(img.imageId)">

                  <span nz-icon nzType="delete"></span>

                </button>

              </div>

            </div>

          </div>

        </div>

      </nz-card>

    </div>

  </div>

</nz-card>
