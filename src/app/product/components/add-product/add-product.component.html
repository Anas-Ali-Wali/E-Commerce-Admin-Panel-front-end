<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">Add Product</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">Create a product record including price and stock details.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="default" routerLink="/product/dashboard">
        <span nz-icon nzType="arrow-left"></span>
        Back to Dashboard
      </button>
    </div>
  </div>

  <form nz-form [formGroup]="productForm" (ngSubmit)="onSubmit()" nzLayout="vertical">
    <div nz-row [nzGutter]="16">

      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label nzRequired>Name</nz-form-label>
          <nz-form-control nzErrorTip="Product name is required">
            <input nz-input formControlName="name" placeholder="Enter product name" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Description</nz-form-label>
          <nz-form-control>
            <textarea nz-input formControlName="description"
              placeholder="Enter product description"
              [nzAutosize]="{ minRows: 3, maxRows: 6 }">
            </textarea>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzRequired>Price</nz-form-label>
          <nz-form-control nzErrorTip="Price is required">
            <nz-input-number formControlName="price" [nzMin]="0"
              [nzStep]="0.01" [nzPrecision]="2" nzPrefix="$"
              style="width: 100%;" nzPlaceHolder="0.00">
            </nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzRequired>Stock Quantity</nz-form-label>
          <nz-form-control nzErrorTip="Stock quantity is required">
            <nz-input-number formControlName="stockQty" [nzMin]="0"
              style="width: 100%;" nzPlaceHolder="0">
            </nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label>Category ID</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="categoryId" [nzMin]="1"
              style="width: 100%;" nzPlaceHolder="Enter category ID (optional)">
            </nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div> -->

      <div nz-col nzSpan="8">
  <nz-form-item>
    <nz-form-label>Category</nz-form-label>
    <nz-form-control>
      <nz-select
        formControlName="categoryId"
        nzAllowClear
        style="width: 100%;">
        <nz-option
          *ngFor="let cat of categories"
          [nzValue]="cat.categoryId"
          [nzLabel]="cat.name">
        </nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>
</div>

            <nz-input-group nzPrefix="🔗">

        </nz-form-item>

  <div nz-col nzSpan="24">
  <nz-form-item>
    <nz-form-label>Product Image</nz-form-label>
    <nz-form-control>
      <input type="file" (change)="onFileSelected($event)" />
    </nz-form-control>
  </nz-form-item>

  <!-- Preview -->
  <div *ngIf="previewUrl" style="margin-top:10px;">
    <img [src]="previewUrl"
      style="width:150px;height:150px;object-fit:cover;border-radius:8px;" />
  </div>
</div>

    </div>

    <div style="text-align: right; margin-top: 8px;">
      <button nz-button nzType="primary" type="submit"
        [disabled]="!productForm.valid" [nzLoading]="isSubmitting">
        Create Product
      </button>
    </div>
  </form>
</nz-card>
