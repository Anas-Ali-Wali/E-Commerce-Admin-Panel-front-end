<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">Add Product</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">Create a product record including price and stock details.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="default" routerLink="/product/dashboard">
        <span nz-icon nzType="arrow-left"></span>
        Back to Dashboard
      </button>
    </div>
  </div>

  <form nz-form [formGroup]="productForm" (ngSubmit)="onSubmit()" nzLayout="vertical">
    <div nz-row [nzGutter]="16">

      <!-- Name -->
      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label nzRequired>Name</nz-form-label>
          <nz-form-control nzErrorTip="Product name is required">
            <input nz-input formControlName="name" placeholder="Enter product name" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- Description -->
      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Description</nz-form-label>
          <nz-form-control>
            <textarea nz-input formControlName="description"
              placeholder="Enter product description"
              [nzAutosize]="{ minRows: 3, maxRows: 6 }">
            </textarea>
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- Price -->
      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzRequired>Price</nz-form-label>
          <nz-form-control nzErrorTip="Price is required">
            <nz-input-number formControlName="price" [nzMin]="0"
              [nzStep]="0.01" [nzPrecision]="2" nzPrefix="Rs"
              style="width: 100%;" nzPlaceHolder="0.00">
            </nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- Stock Qty -->
      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label nzRequired>Stock Quantity</nz-form-label>
          <nz-form-control nzErrorTip="Stock quantity is required">
            <nz-input-number formControlName="stockQty" [nzMin]="0"
              style="width: 100%;" nzPlaceHolder="0">
            </nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- Category -->
      <div nz-col nzSpan="8">
        <nz-form-item>
          <nz-form-label>Category</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="categoryId" nzAllowClear style="width: 100%;">
              <nz-option
                *ngFor="let cat of categories"
                [nzValue]="cat.categoryId"
                [nzLabel]="cat.name">
              </nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- SKU -->
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>SKU / Product Code <span class="optional-label">(optional)</span></nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="sku" placeholder="e.g. FLB-32B-BK" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <!-- Brand -->
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Brand <span class="optional-label">(optional)</span></nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="brand" placeholder="e.g. Flourish Bra" />
          </nz-form-control>
        </nz-form-item>
      </div>

<!-- Sizes -->
<div nz-col nzSpan="24">
  <nz-form-item>
    <nz-form-label>Sizes <span class="optional-label">(optional)</span></nz-form-label>
    <nz-form-control>
      <nz-select
        formControlName="sizes"
        nzMode="multiple"
        nzPlaceHolder="Select sizes"
        style="width: 100%;"
        [nzOptions]="sizeOptions">
      </nz-select>
    </nz-form-control>
  </nz-form-item>
</div>

<!-- Colors -->
<div nz-col nzSpan="24">
  <nz-form-item>
    <nz-form-label>Colors <span class="optional-label">(optional)</span></nz-form-label>
    <nz-form-control>
      <nz-select
        formControlName="colors"
        nzMode="multiple"
        nzPlaceHolder="Select colors"
        style="width: 100%;"
        [nzOptions]="colorOptions">
      </nz-select>
    </nz-form-control>
  </nz-form-item>
</div>


      <!-- Image -->
      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Product Image <span class="optional-label">(optional)</span></nz-form-label>
          <nz-form-control>
            <label class="file-upload-box">
              <input
                type="file"
                (change)="onFileSelected($event)"
                accept="image/*"
                style="display:none;" />
              <span nz-icon nzType="upload"></span>
              <span>{{ selectedFile ? selectedFile.name : 'Click to upload image' }}</span>
            </label>
          </nz-form-control>
        </nz-form-item>
        <div *ngIf="previewUrl" style="margin-top: 10px;">
          <img [src]="previewUrl"
            style="width:150px; height:150px; object-fit:cover; border-radius:8px; border:1px solid #eee;" />
        </div>
      </div>

    </div>

    <div style="text-align: right; margin-top: 24px;">
      <button nz-button nzType="default" style="margin-right: 8px;"
        type="button" routerLink="/product/dashboard">
        Cancel
      </button>
      <button nz-button nzType="primary" type="submit"
        [nzLoading]="isSubmitting">
        Create Product
      </button>
    </div>
  </form>
</nz-card>
