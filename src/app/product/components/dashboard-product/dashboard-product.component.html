<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="h4 mb-1">Product Dashboard</h2>
    <p class="text-muted mb-0">View product inventory and manage listings.</p>
  </div>
  <a class="btn btn-primary" routerLink="/product/add">Add Product</a>
</div>
<div class="row gy-3 align-items-end mb-4">
  <div class="col-md-4">
    <label for="tenantId" class="form-label">Tenant ID</label>
    <input id="tenantId" type="number" class="form-control" [(ngModel)]="tenantId" (change)="onTenantChange()">
  </div>
  <div class="col-auto pt-4">
    <button class="btn btn-outline-secondary" (click)="loadProducts()">Load Products</button>
  </div>
</div>
<div class="table-responsive shadow-sm rounded">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Status</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.productId }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency }}</td>
        <td>{{ product.stockQty }}</td>
        <td>{{ product.status ? 'Active' : 'Inactive' }}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product.productId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<nav class="mt-4" aria-label="Product pagination">
  <ul class="pagination justify-content-end mb-0">
    <li class="page-item" [class.disabled]="currentPage <= 1">
      <button class="page-link" (click)="onPageChange(currentPage - 1)">Previous</button>
    </li>
    <li class="page-item disabled"><span class="page-link">Page {{ currentPage }}</span></li>
    <li class="page-item" [class.disabled]="currentPage * pageSize >= totalCount">
      <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
    </li>
  </ul>
</nav>
