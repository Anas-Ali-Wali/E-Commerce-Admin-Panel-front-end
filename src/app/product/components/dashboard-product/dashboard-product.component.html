<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">Product Dashboard</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">View product inventory and manage listings.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="primary" routerLink="/product/add">
        <span nz-icon nzType="plus"></span>
        Add Product
      </button>
    </div>
  </div>

  <nz-input-group nzPrefixIcon="search" style="width: 300px; margin-bottom: 16px;">
  <input
    nz-input
    placeholder="Search product..."
    [(ngModel)]="searchText"
    (ngModelChange)="onSearch()" />
</nz-input-group>

  <nz-table
    #productTable
    [nzData]="products"
    [nzLoading]="isLoading"
    [nzTotal]="totalCount"
    [nzPageIndex]="currentPage"
    [nzPageSize]="pageSize"
    [nzFrontPagination]="true"
    (nzPageIndexChange)="onPageChange($event)"
    nzBordered
    nzSize="middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Status</th>
        <th nzAlign="right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.productId }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency }}</td>
        <td>
          <nz-tag [nzColor]="product.stockQty === 0 ? 'error' : product.stockQty < 10 ? 'warning' : 'success'">
            {{ product.stockQty }}
          </nz-tag>
        </td>
        <td>
          <nz-tag [nzColor]="product.status ? 'success' : 'error'">
            {{ product.status ? 'Active' : 'Inactive' }}
          </nz-tag>
        </td>
        <td nzAlign="right">
          <button nz-button nzType="default" nzDanger nzSize="small"
            nz-popconfirm nzPopconfirmTitle="Are you sure you want to delete this product?"
            (nzOnConfirm)="deleteProduct(product.productId)">
            <span nz-icon nzType="delete"></span>
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>
