<div class="add-section-data-wrap">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h2 class="page-title">Add Section Data</h2>
      <p class="page-subtitle">Add key-value data for Section ID: {{ sectionId }}</p>
    </div>
    <div class="header-actions">
      <button class="btn-back"
        [routerLink]="['/section-data/dashboard']"
        [queryParams]="{ sectionId: sectionId }">
        <i class="bi bi-arrow-left"></i> Back
      </button>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="form-card">

    <form [formGroup]="sectionDataForm" (ngSubmit)="onSubmit()">

      <div class="form-grid">

        <!-- KEY -->
        <div class="form-group">
          <label class="form-label">Key <span class="req">*</span></label>
          <input
            type="text"
            class="form-input"
            formControlName="key"
            placeholder="e.g. title, image, subtitle"
            [class.is-invalid]="sectionDataForm.get('key')?.invalid && sectionDataForm.get('key')?.dirty" />
          <span class="error-msg" *ngIf="sectionDataForm.get('key')?.invalid && sectionDataForm.get('key')?.dirty">
            Key is required
          </span>
        </div>

        <!-- VALUE -->
        <div class="form-group">
          <label class="form-label">Value</label>
          <textarea
            class="form-textarea"
            formControlName="value"
            placeholder="e.g. Welcome to Store"
            rows="3">
          </textarea>
        </div>

      </div>

      <!-- ACTIONS -->
      <div class="form-actions">
        <button
          type="button"
          class="btn-cancel"
          [routerLink]="['/section-data/dashboard']"
          [queryParams]="{ sectionId: sectionId }">
          Cancel
        </button>
        <button
          type="submit"
          class="btn-submit"
          [disabled]="sectionDataForm.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
          <i class="bi bi-floppy" *ngIf="!isSubmitting"></i>
          {{ isSubmitting ? 'Saving...' : 'Save Data' }}
        </button>
      </div>

    </form>

  </div>

</div>
