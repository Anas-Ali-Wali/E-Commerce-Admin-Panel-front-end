<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">Category Dashboard</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">Manage tenant categories and hierarchy.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="primary" routerLink="/category/add">
        <span nz-icon nzType="plus"></span>
        Add Category
      </button>
    </div>
  </div>

  <nz-table
    #categoryTable
    [nzData]="categories"
    [nzLoading]="isLoading"
    [nzTotal]="totalCount"
    [nzPageIndex]="currentPage"
    [nzPageSize]="pageSize"
    [nzFrontPagination]="false"
    (nzPageIndexChange)="onPageChange($event)"
    nzBordered
    nzSize="middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Parent ID</th>
        <th>Status</th>
        <th nzAlign="right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories">
        <td>{{ category.categoryId }}</td>
        <td>{{ category.name }}</td>
        <td>{{ category.parentCategoryId || '-' }}</td>
        <td>
          <nz-tag [nzColor]="category.status ? 'success' : 'error'">
            {{ category.status ? 'Active' : 'Inactive' }}
          </nz-tag>
        </td>
        <td nzAlign="right">
          <button nz-button nzType="default" nzDanger nzSize="small"
            nz-popconfirm nzPopconfirmTitle="Are you sure you want to delete this category?"
            (nzOnConfirm)="deleteCategory(category.categoryId)">
            <span nz-icon nzType="delete"></span>
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>
