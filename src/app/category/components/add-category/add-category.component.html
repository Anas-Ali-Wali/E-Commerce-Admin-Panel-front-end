<nz-card>
  <div nz-row nzJustify="space-between" nzAlign="middle" style="margin-bottom: 24px;">
    <div nz-col>
      <h2 nz-typography style="margin-bottom: 4px;">Add Category</h2>
      <p nz-typography nzType="secondary" style="margin-bottom: 0;">Add a category for a tenant and assign parent categories.</p>
    </div>
    <div nz-col>
      <button nz-button nzType="default" routerLink="/category/dashboard">
        <span nz-icon nzType="arrow-left"></span>
        Back to Dashboard
      </button>
    </div>
  </div>

  <form nz-form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" nzLayout="vertical">
    <div nz-row [nzGutter]="16">

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzRequired>Name</nz-form-label>
          <nz-form-control nzErrorTip="Name is required">
            <input nz-input formControlName="name" placeholder="Enter category name" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Parent Category ID</nz-form-label>
          <nz-form-control>
            <nz-input-number
              formControlName="parentCategoryId"
              [nzMin]="1"
              style="width: 100%;"
              nzPlaceHolder="Enter parent category ID (optional)">
            </nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12" style="display: flex; align-items: center; padding-top: 28px;">
        <nz-form-item style="margin-bottom: 0;">
          <nz-form-control>
            <label nz-checkbox formControlName="status">Active</label>
          </nz-form-control>
        </nz-form-item>
      </div>

    </div>

    <div style="text-align: right; margin-top: 16px;">
      <button nz-button nzType="primary" type="submit"
        [disabled]="!categoryForm.valid" [nzLoading]="isSubmitting">
        Create Category
      </button>
    </div>
  </form>
</nz-card>
